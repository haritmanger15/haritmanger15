<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Harit Mengar banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4e79">
        <animate attributeName="stop-color" values="#1f4e79;#0f2f52;#1f4e79" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#2ea8ff">
        <animate attributeName="stop-color" values="#2ea8ff;#6c5ce7;#2ea8ff" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <clipPath id="clip"><rect width="1000" height="220" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1000" height="220" fill="url(#bg)"/>
    <!-- floating bubbles -->
    <circle cx="120" cy="170" r="60" fill="#fff" fill-opacity="0.08">
      <animate attributeName="cy" values="170;140;170" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="40" r="90" fill="#fff" fill-opacity="0.07">
      <animate attributeName="cy" values="40;70;40" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="190" r="35" fill="#fff" fill-opacity="0.09">
      <animate attributeName="cx" values="700;740;700" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="40" r="25" fill="#fff" fill-opacity="0.1">
      <animate attributeName="cx" values="260;230;260" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <!-- moving waves -->
    <path d="M0 190 Q 125 160 250 190 T 500 190 T 750 190 T 1000 190 T 1250 190 V220 H0Z" fill="#fff" fill-opacity="0.10">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M0 200 Q 125 175 250 200 T 500 200 T 750 200 T 1000 200 T 1250 200 V220 H0Z" fill="#fff" fill-opacity="0.12">
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="12s" repeatCount="indefinite"/>
    </path>
    <!-- text -->
    <text x="500" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff" opacity="0">
      Harit Mengar
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 18" to="0 0" dur="1.2s" fill="freeze"/>
    </text>
    <text x="500" y="145" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff" opacity="0">
      AI/ML Engineer  |  Data &amp; Automation  |  Python Developer
      <animate attributeName="opacity" from="0" to="0.95" dur="1.2s" begin="0.8s" fill="freeze"/>
    </text>
  </g>
</svg>
