<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-label="Thanks for stopping by. Let's build something together." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070d1a"/><stop offset="1" stop-color="#0f1f3d"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2ea8ff"/><stop offset="1" stop-color="#8b7bff"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#2ea8ff"/></linearGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="700" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#7cc7ff"/><stop offset="1" stop-color="#b39dff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="800 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#2ea8ff" stop-opacity="0.35"/><stop offset="1" stop-color="#2ea8ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="32 32" dur="6s" repeatCount="indefinite"/>
    </pattern>
    <clipPath id="clip"><rect width="1000" height="170" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1000" height="170" fill="url(#bg)"/>
    <rect width="1000" height="170" fill="url(#grid)"/>
    <ellipse cx="500" cy="70" rx="320" ry="90" fill="url(#glow)"><animate attributeName="rx" values="300;340;300" dur="6s" repeatCount="indefinite"/></ellipse>
    <circle cx="120" cy="30" r="1.8" fill="#fff"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" begin="0s" repeatCount="indefinite"/></circle>
<circle cx="260" cy="20" r="1.8" fill="#fff"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" begin="1.1s" repeatCount="indefinite"/></circle>
<circle cx="380" cy="40" r="1.8" fill="#fff"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" begin="0.5s" repeatCount="indefinite"/></circle>
<circle cx="620" cy="25" r="1.8" fill="#fff"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" begin="1.7s" repeatCount="indefinite"/></circle>
<circle cx="740" cy="38" r="1.8" fill="#fff"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" begin="0.9s" repeatCount="indefinite"/></circle>
<circle cx="880" cy="22" r="1.8" fill="#fff"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" begin="0.3s" repeatCount="indefinite"/></circle>
<circle cx="500" cy="15" r="1.8" fill="#fff"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" begin="1.4s" repeatCount="indefinite"/></circle>
<circle cx="180" cy="58" r="1.8" fill="#fff"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" begin="2.0s" repeatCount="indefinite"/></circle>
<circle cx="820" cy="60" r="1.8" fill="#fff"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle>

    <!-- equalizer bars -->
    <g opacity="0.85">
      <rect x="50" y="70" width="8" height="30" rx="3" fill="url(#bar)"><animate attributeName="height" values="30;19;35;51;30" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="70;81;65;49;70" dur="1.7s" repeatCount="indefinite"/></rect>
<rect x="64" y="56" width="8" height="44" rx="3" fill="url(#bar)"><animate attributeName="height" values="44;16;33;47;44" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="56;84;67;53;56" dur="1.7s" repeatCount="indefinite"/></rect>
<rect x="78" y="58" width="8" height="42" rx="3" fill="url(#bar)"><animate attributeName="height" values="42;23;12;15;42" dur="2.3s" repeatCount="indefinite"/><animate attributeName="y" values="58;77;88;85;58" dur="2.3s" repeatCount="indefinite"/></rect>
<rect x="92" y="86" width="8" height="14" rx="3" fill="url(#bar)"><animate attributeName="height" values="14;25;15;45;14" dur="2.3s" repeatCount="indefinite"/><animate attributeName="y" values="86;75;85;55;86" dur="2.3s" repeatCount="indefinite"/></rect>
<rect x="106" y="54" width="8" height="46" rx="3" fill="url(#bar)"><animate attributeName="height" values="46;17;24;50;46" dur="2.6s" repeatCount="indefinite"/><animate attributeName="y" values="54;83;76;50;54" dur="2.6s" repeatCount="indefinite"/></rect>
<rect x="120" y="87" width="8" height="13" rx="3" fill="url(#bar)"><animate attributeName="height" values="13;46;47;35;13" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="87;54;53;65;87" dur="1.7s" repeatCount="indefinite"/></rect>
<rect x="134" y="76" width="8" height="24" rx="3" fill="url(#bar)"><animate attributeName="height" values="24;12;45;18;24" dur="2.1s" repeatCount="indefinite"/><animate attributeName="y" values="76;88;55;82;76" dur="2.1s" repeatCount="indefinite"/></rect>
<rect x="148" y="81" width="8" height="19" rx="3" fill="url(#bar)"><animate attributeName="height" values="19;44;17;46;19" dur="2.1s" repeatCount="indefinite"/><animate attributeName="y" values="81;56;83;54;81" dur="2.1s" repeatCount="indefinite"/></rect>
<rect x="162" y="47" width="8" height="53" rx="3" fill="url(#bar)"><animate attributeName="height" values="53;21;16;47;53" dur="2.5s" repeatCount="indefinite"/><animate attributeName="y" values="47;79;84;53;47" dur="2.5s" repeatCount="indefinite"/></rect>
<rect x="176" y="78" width="8" height="22" rx="3" fill="url(#bar)"><animate attributeName="height" values="22;33;16;45;22" dur="2.7s" repeatCount="indefinite"/><animate attributeName="y" values="78;67;84;55;78" dur="2.7s" repeatCount="indefinite"/></rect>
      <rect x="810" y="54" width="8" height="46" rx="3" fill="url(#bar)"><animate attributeName="height" values="46;13;49;23;46" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="54;87;51;77;54" dur="2.4s" repeatCount="indefinite"/></rect>
<rect x="824" y="56" width="8" height="44" rx="3" fill="url(#bar)"><animate attributeName="height" values="44;37;59;30;44" dur="2.3s" repeatCount="indefinite"/><animate attributeName="y" values="56;63;41;70;56" dur="2.3s" repeatCount="indefinite"/></rect>
<rect x="838" y="61" width="8" height="39" rx="3" fill="url(#bar)"><animate attributeName="height" values="39;33;29;25;39" dur="2.9s" repeatCount="indefinite"/><animate attributeName="y" values="61;67;71;75;61" dur="2.9s" repeatCount="indefinite"/></rect>
<rect x="852" y="46" width="8" height="54" rx="3" fill="url(#bar)"><animate attributeName="height" values="54;59;25;15;54" dur="2.5s" repeatCount="indefinite"/><animate attributeName="y" values="46;41;75;85;46" dur="2.5s" repeatCount="indefinite"/></rect>
<rect x="866" y="57" width="8" height="43" rx="3" fill="url(#bar)"><animate attributeName="height" values="43;41;31;56;43" dur="2.3s" repeatCount="indefinite"/><animate attributeName="y" values="57;59;69;44;57" dur="2.3s" repeatCount="indefinite"/></rect>
<rect x="880" y="52" width="8" height="48" rx="3" fill="url(#bar)"><animate attributeName="height" values="48;14;17;42;48" dur="2.3s" repeatCount="indefinite"/><animate attributeName="y" values="52;86;83;58;52" dur="2.3s" repeatCount="indefinite"/></rect>
<rect x="894" y="42" width="8" height="58" rx="3" fill="url(#bar)"><animate attributeName="height" values="58;31;19;41;58" dur="2.3s" repeatCount="indefinite"/><animate attributeName="y" values="42;69;81;59;42" dur="2.3s" repeatCount="indefinite"/></rect>
<rect x="908" y="48" width="8" height="52" rx="3" fill="url(#bar)"><animate attributeName="height" values="52;14;58;45;52" dur="2.5s" repeatCount="indefinite"/><animate attributeName="y" values="48;86;42;55;48" dur="2.5s" repeatCount="indefinite"/></rect>
<rect x="922" y="70" width="8" height="30" rx="3" fill="url(#bar)"><animate attributeName="height" values="30;31;54;32;30" dur="2.6s" repeatCount="indefinite"/><animate attributeName="y" values="70;69;46;68;70" dur="2.6s" repeatCount="indefinite"/></rect>
<rect x="936" y="53" width="8" height="47" rx="3" fill="url(#bar)"><animate attributeName="height" values="47;39;14;15;47" dur="3.1s" repeatCount="indefinite"/><animate attributeName="y" values="53;61;86;85;53" dur="3.1s" repeatCount="indefinite"/></rect>
    </g>

    <!-- text -->
    <text x="500" y="72" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="url(#shine)" letter-spacing="-0.5">Thanks for stopping by</text>
    <text x="500" y="102" text-anchor="middle" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="17" fill="#c9d6e6" letter-spacing="1">Let's build something together
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
    </text>

    <!-- waves with glowing crest lines -->
    <path d="M0 128 Q 125 108 250 128 T 500 128 T 750 128 T 1000 128 T 1250 128 V170 H0Z" fill="#2ea8ff" fill-opacity="0.10" stroke="#2ea8ff" stroke-opacity="0.5" stroke-width="1.5">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M0 142 Q 125 124 250 142 T 500 142 T 750 142 T 1000 142 T 1250 142 V170 H0Z" fill="#8b7bff" fill-opacity="0.14" stroke="#8b7bff" stroke-opacity="0.5" stroke-width="1.5">
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="13s" repeatCount="indefinite"/>
    </path>
    <path d="M0 156 Q 125 142 250 156 T 500 156 T 750 156 T 1000 156 T 1250 156 V170 H0Z" fill="#0b1426" fill-opacity="0.8">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
  <rect x="1" y="1" width="998" height="168" rx="17" fill="none" stroke="url(#acc)" stroke-opacity="0.5" stroke-width="1.5"/>
</svg>
