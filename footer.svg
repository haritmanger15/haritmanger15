<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110" role="img" aria-label="footer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ea8ff">
        <animate attributeName="stop-color" values="#2ea8ff;#6c5ce7;#2ea8ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#1f4e79">
        <animate attributeName="stop-color" values="#1f4e79;#0f2f52;#1f4e79" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <clipPath id="clip"><rect width="1000" height="110" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1000" height="110" fill="url(#bg)"/>
    <path d="M0 55 Q 125 25 250 55 T 500 55 T 750 55 T 1000 55 T 1250 55 V110 H0Z" fill="#fff" fill-opacity="0.12">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M0 70 Q 125 45 250 70 T 500 70 T 750 70 T 1000 70 T 1250 70 V110 H0Z" fill="#fff" fill-opacity="0.15">
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="11s" repeatCount="indefinite"/>
    </path>
    <path d="M0 88 Q 125 68 250 88 T 500 88 T 750 88 T 1000 88 T 1250 88 V110 H0Z" fill="#fff" fill-opacity="0.18">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
